<!DOCTYPE html>
<html lang="zh-CN" data-i18n-title-key="review.page.title">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待人工确认 - Music Auto Tagger</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="app.css?v=10">
    <script src="i18n.js?v=1"></script>
    <script src="shell.js?v=1"></script>
    <style>
        /* ============================================================
           待确认 —— 「建议 → 选择并核对 → 决定」三段式
           左：队列（只负责挑下一件事）；右：一件事的完整决策面板，
           底部决策条固定在视口内，任何时候都看得到「我现在要做什么」。
           ============================================================ */
        .desk {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }

        /* ---------- 队列 ---------- */
        .queue {
            position: sticky;
            top: 20px;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 40px);
            padding: 0;
            overflow: hidden;
        }
        .queue-top { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
        .kind-tabs { display: flex; gap: 2px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
        .kind-tab {
            flex: 1 1 0; min-width: 0;
            background: none; border: 0; border-radius: 6px; padding: 6px 8px; cursor: pointer;
            font: inherit; font-size: 13px; font-weight: 600; color: var(--text-soft);
            display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
        }
        .kind-tab:hover { color: var(--text); }
        .kind-tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
        .kind-tab .tab-label { overflow: hidden; text-overflow: ellipsis; }
        .tab-count {
            min-width: 18px; padding: 0 6px; border-radius: 9px; background: var(--warn-soft); color: var(--warn);
            font-weight: 700; font-size: 11px; line-height: 18px; text-align: center; display: none; font-variant-numeric: tabular-nums;
        }
        .tab-count.show { display: inline-block; }
        .queue-filter { display: flex; align-items: center; gap: 8px; }
        .queue-filter select {
            flex: 1; min-width: 0; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
            padding: 5px 9px; min-height: 32px; font: inherit; font-size: 13px; color: var(--text); background: #fff;
        }
        .queue-filter select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

        .queue-list { overflow-y: auto; padding: 8px; display: grid; gap: 4px; align-content: start; flex: 1 1 auto; min-height: 120px; }
        .q-item {
            display: grid; gap: 3px; width: 100%; text-align: left; font: inherit; color: var(--text);
            background: transparent; border: 1px solid transparent; border-radius: var(--radius);
            padding: 10px 12px; cursor: pointer; transition: background .14s ease, border-color .14s ease;
        }
        .q-item:hover { background: var(--bg-soft); }
        .q-item.active { background: var(--primary-soft); border-color: var(--primary-line); }
        .q-name { font-weight: 600; font-size: 13.5px; line-height: 1.4; display: flex; gap: 6px; align-items: flex-start; }
        .q-name > span:first-child { min-width: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .q-busy { flex: 0 0 auto; width: 13px; height: 13px; margin-top: 3px; border-width: 2px; }
        .q-meta { font-size: 12px; color: var(--text-mute); font-variant-numeric: tabular-nums; }
        .q-reason { font-size: 12px; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .q-item.active .q-meta, .q-item.active .q-reason { color: #3c4f72; }
        .signals { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
        .signal {
            display: inline-flex; align-items: center; border-radius: 999px; padding: 1px 7px; font-size: 11px; font-weight: 600;
            background: var(--bg-soft); color: var(--text-soft); border: 1px solid var(--border); font-variant-numeric: tabular-nums;
        }
        .signal.online { background: var(--primary-soft); color: var(--primary-dark); border-color: var(--primary-line); }
        .signal.llm { background: #f5f0ff; color: #6d28d9; border-color: #ded0fb; }
        .signal.stale { background: var(--danger-soft); color: var(--danger); border-color: #f2c9cb; }
        .queue-foot { padding: 9px 14px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-mute); display: flex; align-items: center; gap: 6px; }
        kbd {
            font-family: var(--mono); font-size: 10.5px; padding: 0 5px; border-radius: 4px; line-height: 17px;
            border: 1px solid var(--border-strong); border-bottom-width: 2px; background: #fff; color: var(--text-soft);
        }
        .queue-empty { text-align: center; padding: 36px 16px; color: var(--text-mute); font-size: 13px; }

        /* ---------- 详情 ---------- */
        .detail { padding: 0; min-height: 420px; display: flex; flex-direction: column; }
        .detail-body { padding: 20px 22px 8px; flex: 1 1 auto; }
        .detail-blank { display: grid; place-items: center; text-align: center; padding: 80px 24px; color: var(--text-mute); gap: 10px; }
        .detail-blank svg { width: 36px; height: 36px; color: var(--border-strong); }
        .detail-blank .big { font-size: 15px; font-weight: 700; color: var(--text); }
        .detail.is-loading .detail-body { opacity: .45; pointer-events: none; transition: opacity .2s ease .12s; }

        .d-back { display: none; margin: -6px 0 10px -8px; }
        .d-title { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
        .d-title h2 { font-size: 18px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; min-width: 0; flex: 0 1 auto; }
        .d-title .badge { margin-top: 3px; }
        .d-path { font-family: var(--mono); font-size: 11.5px; color: var(--text-mute); margin-top: 4px; overflow-wrap: anywhere; }
        .d-reason { margin-top: 8px; color: var(--text-soft); font-size: 13.5px; }
        .d-facts { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 12px; font-size: 12.5px; }
        .d-facts div { display: flex; gap: 6px; min-width: 0; }
        .d-facts dt { color: var(--text-mute); white-space: nowrap; }
        .d-facts dd { font-weight: 600; overflow-wrap: anywhere; }

        /* 横幅：上一条处理结果 / 本条错误 / 已处置结果 */
        .banner {
            display: flex; align-items: flex-start; gap: 10px; margin-top: 14px; padding: 10px 12px;
            border-radius: var(--radius); border: 1px solid; font-size: 13px; line-height: 1.55;
            animation: banner-in .28s cubic-bezier(.16, 1, .3, 1);
        }
        .banner svg { width: 16px; height: 16px; flex: 0 0 auto; margin-top: 2px; }
        .banner .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
        .banner .sub { color: inherit; opacity: .85; font-size: 12.5px; }
        .banner.ok { background: var(--success-soft); border-color: #bfe3cc; color: #0e5a2f; }
        .banner.err { background: var(--danger-soft); border-color: #f2c9cb; color: #8d1c22; }
        .banner.warn { background: var(--warn-soft); border-color: #f1d3a6; color: #8a3f06; }
        .banner.info { background: var(--info-soft); border-color: #b9e1ea; color: #0b5a70; }
        .banner-close { border: 0; background: transparent; color: inherit; cursor: pointer; padding: 2px; border-radius: 4px; opacity: .7; display: inline-flex; }
        .banner-close:hover { opacity: 1; background: rgba(0,0,0,.05); }
        @keyframes banner-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

        /* 系统建议 */
        .verdict {
            margin-top: 16px; padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--primary-line);
            background: #f5f8ff; display: flex; gap: 12px; align-items: flex-start;
        }
        .verdict-icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: 0 0 auto; background: var(--primary); color: #fff; }
        .verdict-icon svg { width: 17px; height: 17px; }
        .verdict-text { font-size: 15px; font-weight: 700; line-height: 1.45; }
        .verdict-note { font-size: 12.5px; color: var(--text-soft); margin-top: 3px; }
        .verdict.tone-warn { background: #fffaf0; border-color: #f1d3a6; }
        .verdict.tone-warn .verdict-icon { background: var(--warn); }
        .verdict.tone-info { background: #f2fafc; border-color: #b9e1ea; }
        .verdict.tone-info .verdict-icon { background: var(--info); }
        .verdict.tone-mute { background: var(--bg-soft); border-color: var(--border); }
        .verdict.tone-mute .verdict-icon { background: #7a879b; }

        .missing-box { margin-top: 14px; padding: 14px 16px; border-radius: var(--radius); background: #fffbea; border: 1px solid #f3df9b; color: #5f480d; font-size: 13px; }
        .missing-box .t { font-weight: 700; color: #3f2f06; }
        .missing-box ul { margin: 6px 0 0 18px; }
        .missing-box .sub { font-size: 12.5px; color: #785b13; margin-top: 4px; }

        /* 区块 */
        .sec { margin-top: 26px; }
        .sec-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .sec-title { font-size: 14px; font-weight: 700; }
        .sec-meta { font-size: 12px; color: var(--text-mute); }
        .sec-head .btn { margin-left: auto; align-self: center; }
        .sec-foot { font-size: 12px; color: var(--text-mute); margin-top: 8px; line-height: 1.6; }

        /* 候选：单选列表。选中项展开核对材料 */
        .cands { display: grid; gap: 8px; }
        .cand {
            border: 1px solid var(--border); border-radius: var(--radius); background: #fff;
            transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
        }
        .cand-row { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 14px; cursor: pointer; border-radius: inherit; }
        .cand.static .cand-row { cursor: default; grid-template-columns: minmax(0, 1fr) auto; }
        .cand.static .radio { display: none; }
        .cand:not(.static):not(.disabled):hover { border-color: #bcc5d3; }
        .cand.selected { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
        .cand.disabled .cand-row { cursor: not-allowed; }
        .cand.disabled .cand-main, .cand.disabled .cand-stats { opacity: .6; }
        .cand-row:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
        .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border-strong); background: #fff; position: relative; transition: border-color .15s ease; }
        .cand.selected .radio { border-color: var(--primary); }
        .cand.selected .radio::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--primary); }
        .cand-title { font-weight: 600; font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; overflow-wrap: anywhere; }
        .cand-sub { font-size: 12px; color: var(--text-mute); margin-top: 2px; overflow-wrap: anywhere; }
        .cand-sub .id { font-family: var(--mono); font-size: 11px; }
        .tag { display: inline-flex; align-items: center; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 700; line-height: 18px; white-space: nowrap; }
        .tag.sys { background: var(--primary); color: #fff; }
        .tag.best { background: var(--success-soft); color: var(--success); }
        .tag.llm { background: #f5f0ff; color: #6d28d9; }
        .tag.near { background: #fff3c4; color: #7a5a00; }
        .tag.stale { background: var(--danger-soft); color: var(--danger); }
        .cand-stats { display: flex; gap: 18px; align-items: center; }
        .stat { display: grid; gap: 1px; text-align: right; min-width: 52px; }
        .stat-k { font-size: 11px; color: var(--text-mute); white-space: nowrap; }
        .stat-v { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; justify-content: flex-end; }
        .d-ok { color: var(--success); }
        .d-warn { color: var(--warn); }
        .d-bad { color: var(--danger); }
        .meter { width: 52px; height: 6px; border-radius: 9px; background: #e8ecf2; overflow: hidden; display: inline-block; }
        .meter i { display: block; height: 100%; background: #9aa7ba; border-radius: 9px; }
        .meter i.hi { background: var(--success); }
        .meter i.mid { background: var(--warn); }
        .muted { color: var(--text-mute); }
        .cand-need { font-size: 12px; color: var(--text-mute); white-space: nowrap; }

        .cand-more { border-top: 1px solid var(--border); padding: 12px 14px 14px; background: #fafbfd; border-radius: 0 0 var(--radius) var(--radius); animation: banner-in .22s cubic-bezier(.16, 1, .3, 1); }
        .cand-more-title { font-size: 12px; font-weight: 700; color: var(--text-soft); margin-bottom: 6px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
        .cand-more-title .hint { font-weight: 400; font-size: 11.5px; }
        .cmp { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
        .cmp th { font-size: 11px; color: var(--text-mute); font-weight: 600; text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--border); }
        .cmp td { text-align: right; padding: 3px 8px; border-bottom: 1px dashed #edf0f5; }
        .cmp th:first-child, .cmp td:first-child { text-align: left; color: var(--text-mute); width: 36px; }
        .cmp tr:last-child td { border-bottom: 0; }
        .cmp-wrap { max-height: 300px; overflow-y: auto; }
        .match-line { font-size: 12.5px; color: var(--text-soft); padding: 2px 0; overflow-wrap: anywhere; }
        .match-line .num { font-family: var(--mono); font-size: 11.5px; color: var(--text-mute); margin-right: 6px; }
        .src-line { font-size: 12.5px; color: var(--text-soft); padding: 2px 0; overflow-wrap: anywhere; }
        .src-rel { font-family: var(--mono); font-size: 10.5px; padding: 0 5px; border-radius: 4px; background: var(--bg-soft); border: 1px solid var(--border); margin-right: 6px; }
        .cand-reason { font-size: 12.5px; color: var(--text-soft); margin-top: 4px; }

        .llm-box { padding: 12px 14px; border-radius: var(--radius); border: 1px solid #ded0fb; background: #faf7ff; font-size: 13px; }
        .llm-box .sub { font-size: 12.5px; color: #5b4a86; margin-top: 3px; }

        .plain-details > summary { cursor: pointer; font-size: 12.5px; color: var(--primary); list-style: none; display: inline-flex; gap: 6px; align-items: center; }
        .plain-details > summary::-webkit-details-marker { display: none; }
        .plain-details > summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .15s ease; }
        .plain-details[open] > summary::before { transform: rotate(45deg); }
        .plain-details .body { margin-top: 8px; font-size: 12.5px; color: var(--text-soft); line-height: 1.65; }

        .table-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; }
        .table td.mono-s { font-family: var(--mono); font-size: 12px; }

        /* ---------- 决策条 ---------- */
        .decision {
            position: sticky; bottom: 0; z-index: 20;
            border-top: 1px solid var(--border);
            background: rgba(255, 255, 255, .96);
            backdrop-filter: saturate(1.4) blur(6px);
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            padding: 12px 22px;
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
            box-shadow: 0 -8px 20px -14px rgba(18, 26, 38, .25);
        }
        .decision[hidden] { display: none; }
        .decision-status { flex: 1 1 240px; min-width: 0; font-size: 13px; display: flex; align-items: center; gap: 10px; }
        .decision-status .k { color: var(--text-mute); white-space: nowrap; }
        .decision-status .v { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        .decision-status .muted { color: var(--text-mute); }
        .decision-status .busy-label { font-weight: 600; color: var(--primary-dark); }
        .decision-status .busy-sub { font-size: 12px; color: var(--text-mute); }
        .decision-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: auto; }
        .decision .spinner { width: 18px; height: 18px; border-width: 2.5px; flex: 0 0 auto; }
        .btn .spinner { width: 14px; height: 14px; border-width: 2px; border-color: rgba(255,255,255,.4); border-top-color: #fff; }

        .menu-wrap { position: relative; }
        .menu {
            position: absolute; right: 0; bottom: calc(100% + 8px); width: 300px; max-width: 86vw;
            background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
            box-shadow: 0 16px 40px -8px rgba(18, 26, 38, .25); padding: 6px; display: none; z-index: 40;
            animation: banner-in .16s ease-out;
        }
        .menu.show { display: block; }
        .menu-item {
            display: grid; gap: 2px; width: 100%; text-align: left; border: 0; background: transparent; font: inherit;
            padding: 9px 10px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text);
        }
        .menu-item:hover:not(:disabled) { background: var(--bg-soft); }
        .menu-item:disabled { opacity: .45; cursor: not-allowed; }
        .menu-item .mi-t { font-size: 13px; font-weight: 600; }
        .menu-item .mi-d { font-size: 12px; color: var(--text-mute); line-height: 1.5; }
        .menu-item.danger .mi-t { color: var(--danger); }
        .menu-item.danger:hover:not(:disabled) { background: var(--danger-soft); }

        /* 确认弹窗里的摘要 */
        .ask-facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; padding: 12px 14px; border-radius: var(--radius); background: var(--bg-soft); border: 1px solid var(--border); font-size: 13px; }
        .ask-facts dt { color: var(--text-mute); white-space: nowrap; }
        .ask-facts dd { font-weight: 600; overflow-wrap: anywhere; }
        .ask-body p { font-size: 13px; color: var(--text-soft); line-height: 1.65; }
        .ask-body p + p { margin-top: 6px; }
        .ask-warn { padding: 9px 12px; border-radius: var(--radius-sm); background: var(--warn-soft); border: 1px solid #f1d3a6; color: #8a3f06; font-size: 12.5px; line-height: 1.6; }

        .cover-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; margin-top:8px; }
        .cover-choice { border:2px solid var(--border); border-radius:8px; padding:6px; cursor:pointer; background:#fff; text-align:left; font:inherit; }
        .cover-choice.selected { border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-soft); }
        .cover-choice img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:5px; background:var(--bg-soft); display:block; }
        .cover-meta { font-size:11px; color:var(--text-mute); margin-top:5px; word-break:break-word; }
        .cover-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

        @media (max-width: 1100px) { .desk { grid-template-columns: 280px minmax(0, 1fr); } .cand-stats { gap: 12px; } }
        /* 窄屏：队列与详情二选一，打开条目即进入详情，左上角返回 */
        @media (max-width: 980px) {
            .desk { grid-template-columns: minmax(0, 1fr); }
            .queue { position: static; max-height: none; }
            .queue-list { max-height: none; }
            .desk[data-view="detail"] .queue { display: none; }
            .desk[data-view="queue"] .detail { display: none; }
            .d-back { display: inline-flex; }
            .queue-foot { display: none; }
            .detail { scroll-margin-top: 72px; }
        }
        @media (max-width: 640px) {
            .detail-body { padding: 16px 14px 8px; }
            .decision { padding: 10px 14px; }
            .cand-row { grid-template-columns: 20px minmax(0, 1fr); }
            .cand.static .cand-row { grid-template-columns: minmax(0, 1fr); }
            .cand-stats { grid-column: 2 / -1; justify-content: flex-start; flex-wrap: wrap; }
            .cand.static .cand-stats { grid-column: 1 / -1; }
            .stat { text-align: left; }
            .stat-v { justify-content: flex-start; }
            .decision { gap: 8px; }
            .decision-status { flex-basis: 100%; font-size: 12.5px; }
            .decision-status .busy-sub:not([data-elapsed]) { display: none; }
            .decision-actions { width: 100%; margin-left: 0; flex-wrap: nowrap; }
            .decision-actions .menu-wrap .btn span, .decision-actions [data-act="search"] span { display: none; }
            .decision-actions .menu-wrap .btn, .decision-actions [data-act="search"] { padding: 6px 10px; }
            .decision-actions [data-act="search"] svg, .decision-actions .menu-wrap .btn svg { width: 17px; height: 17px; }
            .decision-actions .primary-slot { flex: 1 1 auto; }
            .decision-actions .primary-slot .btn { width: 100%; }
            .menu { right: auto; left: 0; }
        }
    </style>
</head>
<body>
<div class="shell">
<aside class="side" id="appSide">
    <a class="side-brand" href="index.html">
        <img src="logo.png" alt="Music Auto Tagger">
        <span>
            <span class="brand-title" data-i18n="web.brand">音乐自动标签器</span>
            <span class="brand-subtitle" data-i18n="web.subtitle">实时监控 · 智能整理 · 数据统计</span>
        </span>
    </a>
    <button class="side-toggle" onclick="Shell.toggleNav()" aria-label="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
