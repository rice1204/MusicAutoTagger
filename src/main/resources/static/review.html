<script>
    const t = (k, d) => I18n.t(k, d);
    const tf = (k, ...a) => I18n.tf(k, ...a);
    const $ = id => document.getElementById(id);

    const ICON = {
        ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
        err: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>',
        warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
        info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
        close: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
        back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
        spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>',
        search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
        layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg>',
        inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1 3h6l1-3h5"/></svg>',
        dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>'
    };

    // ==================== 状态 ====================
    const state = {
        csrf: null,
        kind: location.hash === '#missing' ? 'TRACKS_MISSING' : (location.hash === '#album' ? 'ALBUM_UNRESOLVED' : null),
        items: [],          // 当前 Tab + 过滤条件下的列表
        currentId: null,
        item: null,         // 当前详情
        selection: null,    // {type:'local', releaseId, releaseGroupId} | {type:'online', id}
        busy: {},           // id -> {key, label, start}，允许在一条忙的时候去处理别的条目
        alerts: {},         // id -> {tone, text}，持续显示直到关闭或下一次操作
        flash: null,        // 上一条处理结果（自动跳到下一条时显示）
        menuOpen: false
    };

    // ==================== 基础 ====================
    async function init() {
        await I18n.load();
        I18n.apply();
        try {
            const resp = await fetch('/api/auth/status');
            const data = await resp.json();
            if (!data.authenticated) {
                document.body.innerHTML = '<div class="app" style="max-width: 460px; margin-top: 12vh;">'
                    + '<div class="card"><div class="empty">' + escapeHtml(t('review.not.logged.in'))
                    + ' <a href="/index.html">' + escapeHtml(t('review.main.panel')) + '</a>.</div></div></div>';
                return;
            }
            state.csrf = data.csrfToken;
        } catch (e) {
            toast(t('review.auth.failed') + ': ' + e.message);
            return;
        }
        renderBlank();
        await loadList({ autoOpen: !isNarrow() });
    }

    let toastTimer = null;
    function toast(msg) {
        const el = $('toast');
        el.textContent = msg;
        el.style.display = 'block';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    async function api(path, options = {}) {
        options.headers = options.headers || {};
        if (state.csrf) options.headers['X-CSRF-Token'] = state.csrf;
        if (options.body) options.headers['Content-Type'] = 'application/json';
        const resp = await fetch(path, options);
        let data = {};
        try { data = await resp.json(); } catch (e) { /* ignore */ }
        if (!resp.ok) {
            const error = new Error(data.error || ('HTTP ' + resp.status));
            error.data = data;
            throw error;
        }
        return data;
    }

    const isNarrow = () => window.matchMedia('(max-width: 980px)').matches;

    // 后端错误码 -> 人话。GET（展开）与 POST（处置）共用。
    const ERROR_KEYS = {
        'item.already.resolved': 'review.error.already.resolved',
        'item.not.rejected': 'review.error.item.not.rejected',
        'folder.already.pending': 'review.error.folder.already.pending',
        'unreject.log.failed': 'review.error.unreject.log.failed',
        'files.missing': 'review.error.files.missing',
        'candidate.not.found': 'review.error.candidate.not.found',
        'release.id.required': 'review.error.release.required',
        'csrf.invalid': 'review.error.csrf',
        'candidates.expand.failed': 'review.error.expand.failed',
        'llm.judge.disabled': 'review.error.llm.disabled',
        'llm.not.configured': 'review.error.llm.not.configured',
        'llm.call.failed': 'review.error.llm.call.failed',
        'llm.web.search.unavailable': 'review.error.web.search.unavailable',
        'recovery.unavailable': 'review.error.recovery.unavailable',
        'recovery.already.running': 'review.error.online.already.running',
        'item.not.found': 'review.error.item.not.found',
        'recovery.no.audio.files': 'review.error.no.audio.files',
        'cover.selection.expired': 'review.error.cover.expired',
        'online.destination.exists': 'review.error.destination.exists',
        'online.duplicate.exists': 'review.duplicate.title'
    };

    function humanError(message) {
        const coverage = /^online\.track\.coverage\.insufficient:(\d+)\/(\d+)$/.exec(message || '');
        if (coverage) return tf('review.error.online.coverage.insufficient', coverage[1], coverage[2]);
        const mismatch = /^recovery\.workspace\.count\.mismatch:(\d+)\/(\d+)$/.exec(message || '');
        if (mismatch) return tf('recovery.workspace.count.mismatch', mismatch[1], mismatch[2]);
        const key = ERROR_KEYS[message];
        return key ? t(key) : message;
    }

    function statusBadge(status) {
        const map = {
            PENDING_REVIEW: ['pending', 'review.status.pending'],
            CONFIRMED: ['confirmed', 'review.status.confirmed'],
            ARCHIVED_UNVERIFIED: ['unverified', 'review.status.archived'],
            REJECTED: ['rejected', 'review.status.rejected']
        };
        const entry = map[status];
        return `<span class="badge ${entry ? entry[0] : ''}">${escapeHtml(entry ? t(entry[1]) : status)}</span>`;
    }

    // ==================== 队列 ====================
    async function loadStats() {
        try {
            const data = await api('/api/review/stats');
            setTabCount('tabCountAlbum', data.pendingAlbum || 0);
            setTabCount('tabCountMissing', data.pendingMissingTracks || 0);
            $('rejectedOption').textContent = tf('review.filter.rejected.count', data.rejected || 0);
            return data;
        } catch (e) {
            return null; // 统计失败不影响列表本身
        }
    }

    function setTabCount(id, count) {
        const el = $(id);
        el.textContent = count > 99 ? '99+' : String(count);
        el.classList.toggle('show', count > 0);
    }

    function applyKindTabs() {
        document.querySelectorAll('#kindTabs .kind-tab').forEach(btn => {
            const on = btn.dataset.kind === state.kind;
            btn.classList.toggle('active', on);
            btn.setAttribute('aria-selected', on ? 'true' : 'false');
        });
    }

    function switchKind(kind) {
        if (state.kind === kind) return;
        state.kind = kind;
        history.replaceState(null, '', kind === 'TRACKS_MISSING' ? '#missing' : '#album');
        state.flash = null;
        closeDetail();
        applyKindTabs();
        loadList({ autoOpen: !isNarrow() });
    }

    /**
     * 拉列表并重绘。autoOpen：当前没有打开条目时自动打开第一条，
     * 用户进来就能直接开始处理，不用先点一下。
     */
    async function loadList({ autoOpen = false } = {}) {
        const stats = await loadStats();
        if (window.Shell) Shell.refreshReviewCount();
        if (!state.kind) {
            // 首次进入：哪个 Tab 有待处理就打开哪个，两个都有时优先「专辑待确认」
            state.kind = stats && !(stats.pendingAlbum > 0) && stats.pendingMissingTracks > 0
                ? 'TRACKS_MISSING' : 'ALBUM_UNRESOLVED';
        }
        applyKindTabs();
        const status = $('statusFilter').value;
        const listEl = $('list');
        try {
            const data = await api('/api/review/list?status=' + encodeURIComponent(status));
            state.items = (data.items || []).filter(item => (item.kind || 'ALBUM_UNRESOLVED') === state.kind);
        } catch (e) {
            listEl.innerHTML = `<div class="queue-empty">${escapeHtml(t('review.load.failed'))}: ${escapeHtml(humanError(e.message))}</div>`;
            return [];
        }
        renderList();
        if (autoOpen && !state.currentId && state.items.length) {
            openItem(state.items[0].id);
        } else if (!state.currentId) {
            renderBlank();
        }
        return state.items;
    }

    function renderList() {
        const listEl = $('list');
        if (!state.items.length) {
            listEl.innerHTML = `<div class="queue-empty">${escapeHtml(t('review.no.items'))}</div>`;
            return;
        }
        const pendingView = $('statusFilter').value === 'PENDING_REVIEW';
        listEl.innerHTML = state.items.map(item => {
            const local = item.localEvidenceAvailable && validScore(item.confidence) ? percent(item.confidence) : null;
            const onlineCount = item.onlineCandidateCount || 0;
            const llm = item.llmSuggestion;
            const signals = [
                local ? `<span class="signal">${escapeHtml(tf('review.signal.local', local))}</span>` : '',
                onlineCount ? `<span class="signal online">${escapeHtml(tf('review.signal.online', onlineCount, percent(item.bestOnlineTrackCoverage)))}</span>` : '',
                llm && validScore(llm.confidence) ? `<span class="signal llm">${escapeHtml(tf('review.signal.llm', percent(llm.confidence)))}</span>` : '',
                item.onlineEvidenceStale ? `<span class="signal stale">${escapeHtml(t('review.signal.stale'))}</span>` : ''
            ].join('');
            const meta = [tf('review.files.count', item.fileCount, item.candidateCount), ago(item.createdAt)].filter(Boolean).join(' · ');
            const busy = state.busy[item.id] ? '<span class="spinner q-busy" aria-hidden="true"></span>' : '';
            return `<button type="button" class="q-item ${item.id === state.currentId ? 'active' : ''}" role="option"
                    aria-selected="${item.id === state.currentId}" data-open="${escapeHtml(item.id)}">
                <span class="q-name"><span>${escapeHtml(item.folderName || '')}</span>${busy}</span>
                <span class="q-meta">${pendingView ? '' : statusBadge(item.status) + ' '}${escapeHtml(meta)}</span>
                ${item.reason ? `<span class="q-reason" title="${escapeHtml(item.reason)}">${escapeHtml(item.reason)}</span>` : ''}
                ${signals ? `<span class="signals">${signals}</span>` : ''}
            </button>`;
        }).join('');
    }

    function markActive() {
        document.querySelectorAll('#list .q-item').forEach(el => {
            const on = el.dataset.open === state.currentId;
            el.classList.toggle('active', on);
            el.setAttribute('aria-selected', on ? 'true' : 'false');
        });
    }

    function moveSelection(delta) {
        if (!state.items.length) return;
        const idx = state.items.findIndex(i => i.id === state.currentId);
        const next = state.items[Math.max(0, Math.min(state.items.length - 1, idx < 0 ? 0 : idx + delta))];
        if (next && next.id !== state.currentId) {
            openItem(next.id);
            const el = document.querySelector(`#list .q-item[data-open="${CSS.escape(next.id)}"]`);
            if (el) el.scrollIntoView({ block: 'nearest' });
        }
    }

    // ==================== 详情 ====================
    function closeDetail() {
        state.currentId = null;
        state.item = null;
        state.selection = null;
        $('desk').dataset.view = 'queue';
        renderBlank();
    }

    function renderBlank() {
        const pendingView = $('statusFilter').value === 'PENDING_REVIEW';
        const cleared = pendingView && state.items.length === 0;
        $('detail').innerHTML = `${renderFlash()}<div class="detail-blank">
            ${ICON.inbox}
            <div class="big">${escapeHtml(cleared ? t('review.queue.clear.title') : t('review.select.folder'))}</div>
            ${cleared ? `<div>${escapeHtml(t('review.queue.clear.desc'))}</div>` : ''}
        </div>`;
        $('decision').hidden = true;
    }

    async function openItem(id, { keepFlash = false } = {}) {
        if (!keepFlash) state.flash = null;
        const switching = id !== state.currentId;
        state.currentId = id;
        state.menuOpen = false;
        markActive();
        $('desk').dataset.view = 'detail';
        const card = $('detailCard');
        card.classList.add('is-loading');
        try {
            const data = await api('/api/review/item?id=' + encodeURIComponent(id));
            if (state.currentId !== id) return; // 用户已经切到别的条目
            setItem(data.item, { resetSelection: switching });
            // 只在详情顶部已滚出视口时才回滚，首次自动打开不要让页面跳动
            if (switching && card.getBoundingClientRect().top < 0) {
                card.scrollIntoView({ block: 'start', behavior: isNarrow() ? 'auto' : 'smooth' });
            }
        } catch (e) {
            if (state.currentId !== id) return;
            state.item = null;
            $('detail').innerHTML = `<div class="detail-blank"><div class="big">${escapeHtml(t('review.load.failed'))}</div>
                <div>${escapeHtml(humanError(e.message))}</div></div>`;
            $('decision').hidden = true;
        } finally {
            if (state.currentId === id) card.classList.remove('is-loading');
        }
    }

    function setItem(item, { resetSelection }) {
        const prev = state.selection;
        state.item = item;
        state.selection = resetSelection ? defaultSelection(item) : (selectionValid(item, prev) ? prev : defaultSelection(item));
        renderDetail();
    }

    /** 系统建议指向的候选自动预选：建议、选择、确认是同一件事，不再分散在三处 */
    function defaultSelection(item) {
        if (item.status !== 'PENDING_REVIEW') return null;
        const s = item.systemSuggestion || {};
        const p = s.primaryActionParams || {};
        if (s.primaryAction === 'CONFIRM_LOCAL' && p.releaseId) {
            const c = (item.candidates || []).find(x => x.releaseId === p.releaseId);
            if (c) return { type: 'local', releaseId: c.releaseId, releaseGroupId: c.releaseGroupId || '' };
        }
        if (s.primaryAction === 'CONFIRM_ONLINE' && p.onlineCandidateId && !item.onlineEvidenceStale) {
            const c = (item.onlineCandidates || []).find(x => x.id === p.onlineCandidateId);
            if (c) return { type: 'online', id: c.id };
        }
        return null;
    }

    function selectionValid(item, sel) {
        if (!sel || item.status !== 'PENDING_REVIEW') return false;
        if (sel.type === 'local') return (item.candidates || []).some(c => c.releaseId && c.releaseId === sel.releaseId);
        if (sel.type === 'online') return !item.onlineEvidenceStale && (item.onlineCandidates || []).some(c => c.id === sel.id);
        return false;
    }

    function selectedCandidate() {
        const item = state.item, sel = state.selection;
        if (!item || !sel) return null;
        if (sel.type === 'local') return (item.candidates || []).find(c => c.releaseId === sel.releaseId) || null;
        return (item.onlineCandidates || []).find(c => c.id === sel.id) || null;
    }

    function select(type, key) {
        const item = state.item;
        if (!item || item.status !== 'PENDING_REVIEW') return;
        const cur = state.selection;
        if (cur && cur.type === type && (type === 'local' ? cur.releaseId === key : cur.id === key)) {
            state.selection = null; // 再点一次取消选择
        } else if (type === 'local') {
            const c = (item.candidates || []).find(x => x.releaseId === key);
            if (!c) return;
            state.selection = { type, releaseId: c.releaseId, releaseGroupId: c.releaseGroupId || '' };
        } else {
            if (item.onlineEvidenceStale) return;
            state.selection = { type, id: key };
        }
        const y = window.scrollY;
        renderDetail();
        window.scrollTo(0, y);
    }

    function renderDetail() {
        const item = state.item;
        if (!item) return renderBlank();
        const pending = item.status === 'PENDING_REVIEW';
        const facts = [
            ['review.fact.synth.title', item.synthesizedAlbumTitle || '-'],
            ['review.fact.synth.artist', item.synthesizedAlbumArtist || '-'],
            ['review.fact.local.evidence', item.localEvidenceAvailable && validScore(item.confidence) ? percent(item.confidence) : t('review.not.applicable')]
        ];
        $('detail').innerHTML = `
            <button class="btn plain sm d-back" data-act="back">${ICON.back}<span>${escapeHtml(t('review.back.queue'))}</span></button>
            <div class="d-title"><h2>${escapeHtml(item.folderName || '')}</h2>${statusBadge(item.status)}</div>
            <div class="d-path">${escapeHtml(item.folderPath || '')}</div>
            ${item.reason ? `<p class="d-reason">${escapeHtml(item.reason)}</p>` : ''}
            <dl class="d-facts">${facts.map(([k, v]) => `<div><dt>${escapeHtml(t(k))}</dt><dd>${escapeHtml(v)}</dd></div>`).join('')}</dl>
            ${renderFlash()}
            ${renderAlert(item)}
            ${renderResolution(item)}
            ${renderMissingTracks(item)}
            ${pending ? renderVerdict(item) : ''}
            ${renderLocalCandidates(item)}
            ${renderOnline(item)}
            ${renderLlm(item)}
            ${renderFiles(item)}
            <div class="sec">
                <details class="plain-details">
                    <summary>${escapeHtml(t('review.scores.help'))}</summary>
                    <div class="body">${escapeHtml(t('review.confidence.note'))}</div>
                </details>
            </div>
            <div style="height: 14px"></div>
        `;
        renderDecision();
    }

    function renderFlash() {
        const f = state.flash;
        if (!f) return '';
        const head = tf('review.done.' + f.status, f.folderName || '');
        const tail = f.next ? t('review.done.next') : (f.cleared ? t('review.queue.clear.title') : '');
        return `<div class="banner ok">${ICON.ok}<div class="grow"><div><strong>${escapeHtml(head)}</strong>${tail ? ' · ' + escapeHtml(tail) : ''}</div>
            ${f.note ? `<div class="sub">${escapeHtml(f.note)}</div>` : ''}</div>
            <button class="banner-close" data-act="dismiss-flash" aria-label="${escapeHtml(t('review.dismiss'))}">${ICON.close}</button></div>`;
    }

    function renderAlert(item) {
        const a = state.alerts[item.id];
        if (!a) return '';
        return `<div class="banner ${a.tone}" role="alert">${ICON[a.tone] || ICON.err}<div class="grow">${escapeHtml(a.text)}</div>
            <button class="banner-close" data-act="dismiss-alert" aria-label="${escapeHtml(t('review.dismiss'))}">${ICON.close}</button></div>`;
    }

    function renderResolution(item) {
        if (item.status === 'PENDING_REVIEW') return '';
        const tone = item.status === 'REJECTED' ? 'warn' : (item.status === 'CONFIRMED' ? 'ok' : 'info');
        // 已忽略还能撤销，不能说「无需继续操作」
        const head = item.status === 'REJECTED' ? t('review.status.rejected') : t('review.suggestion.level.RESOLVED');
        return `<div class="banner ${tone}">${ICON[tone]}<div class="grow"><strong>${escapeHtml(head)}</strong>
            ${item.resolutionNote ? `<div class="sub">${escapeHtml(tf('review.resolution', item.resolutionNote))}</div>` : ''}</div></div>`;
    }

    function renderMissingTracks(item) {
        const m = item.missingTracks;
        if (item.kind !== 'TRACKS_MISSING' || !m) return '';
        const unmatched = Object.entries(m.unmatchedFiles || {});
        return `<div class="missing-box">
            <div class="t">${escapeHtml(tf('review.missing.closest', m.albumTitle || '-', m.albumArtist || '-'))}</div>
            <div class="sub">${escapeHtml(tf('review.missing.counts', m.localTrackCount || '-', m.releaseTrackCount || '-', Math.max(1, m.unmatchedLocalCount || 0)))}
                · ${escapeHtml(t(m.detectedBy === 'TRACK_CHECK' ? 'review.missing.detected.track' : 'review.missing.detected.lock'))}</div>
            ${unmatched.length ? `<div class="sub" style="margin-top:8px">${escapeHtml(t('review.missing.unmatched.files'))}</div>
                <ul>${unmatched.map(([file, title]) => `<li>${escapeHtml(file)}${title ? ' → ' + escapeHtml(title) : ''}</li>`).join('')}</ul>` : ''}
            <div class="sub" style="margin-top:8px">${escapeHtml(t('review.missing.hint'))}</div>
        </div>`;
    }

    const LEVEL_TONE = {
        CONFIRM_LOCAL: 'ok', CONFIRM_ONLINE: 'ok', CONFLICT: 'warn', SUGGEST_ARCHIVE_UNVERIFIED: 'warn',
        NEEDS_EXPAND: 'info', TRY_ONLINE_SEARCH: 'info', WEAK_ALL: 'mute'
    };

    function renderVerdict(item) {
        const s = item.systemSuggestion;
        if (!s) return '';
        const level = s.level || 'WEAK_ALL';
        const tone = LEVEL_TONE[level] || 'mute';
        const notes = [];
        if (s.llmDirection) notes.push(t('review.suggestion.llm.' + s.llmDirection));
        const p = s.primaryActionParams || {};
        if (s.primaryAction === 'CONFIRM_LOCAL') {
            const c = (item.candidates || []).find(x => x.releaseId && x.releaseId === p.releaseId);
            notes.push(c ? tf('review.verdict.preselected', candidateLabel(c)) : t('review.suggestion.action.unavailable'));
        } else if (s.primaryAction === 'CONFIRM_ONLINE') {
            const c = (item.onlineCandidates || []).find(x => x.id === p.onlineCandidateId);
            notes.push(c && !s.onlineEvidenceStale ? tf('review.verdict.preselected.online', onlineLabel(c)) : t('review.suggestion.action.unavailable'));
        } else if (s.onlineEvidenceStale) {
            notes.push(t('review.online.select.stale'));
        }
        const icon = tone === 'ok' ? ICON.spark : (tone === 'warn' ? ICON.warn : (level === 'NEEDS_EXPAND' ? ICON.layers : (level === 'TRY_ONLINE_SEARCH' ? ICON.search : ICON.info)));
        return `<section class="verdict ${tone === 'ok' ? '' : 'tone-' + tone}" aria-label="${escapeHtml(t('review.suggestion.title'))}">
            <span class="verdict-icon">${icon}</span>
            <div><div class="verdict-text">${escapeHtml(t('review.suggestion.level.' + level))}</div>
            ${notes.map(n => `<div class="verdict-note">${escapeHtml(n)}</div>`).join('')}</div>
        </section>`;
    }

    function candidateLabel(c) {
        return [c.title, c.mediaFormat, c.trackCount ? tf('review.tracks.n', c.trackCount) : ''].filter(Boolean).join(' · ');
    }
    function onlineLabel(c) {
        return [c.title, c.edition, c.albumArtist || c.artist].filter(Boolean).join(' · ');
    }

    function simClass(v) { return v >= 0.85 ? 'hi' : (v >= 0.75 ? 'mid' : ''); }

    function renderLocalCandidates(item) {
        const list = item.candidates || [];
        if (!list.length) return '';
        const pending = item.status === 'PENDING_REVIEW';
        const sims = list.map(c => c.durationSimilarity == null ? -1 : c.durationSimilarity);
        const bestSim = Math.max(...sims);
        const bestIndex = bestSim >= 0 ? sims.indexOf(bestSim) : -1;
        const s = item.systemSuggestion || {};
        const sysRelease = (s.primaryAction === 'CONFIRM_LOCAL' && s.primaryActionParams) ? s.primaryActionParams.releaseId : null;
        const llm = item.llmSuggestion;
        const llmRelease = llm && llm.choiceIndex > 0 ? llm.suggestedReleaseId : null;
        const sel = state.selection;

        const rows = list.map((c, i) => {
            const selectable = pending && !!c.releaseId;
            const selected = !!(sel && sel.type === 'local' && c.releaseId && sel.releaseId === c.releaseId);
            const tags = [
                c.releaseId && c.releaseId === sysRelease ? `<span class="tag sys">${escapeHtml(t('review.badge.suggested'))}</span>` : '',
                i === bestIndex && list.length > 1 ? `<span class="tag best">${escapeHtml(t('review.badge.best'))}</span>` : '',
                c.releaseId && c.releaseId === llmRelease ? `<span class="tag llm">${escapeHtml(t('review.badge.llm'))}</span>` : '',
                item.missingTracks && c.releaseId && c.releaseId === item.missingTracks.releaseId ? `<span class="tag near">${escapeHtml(t('review.missing.closest.badge'))}</span>` : ''
            ].join('');
            const sub = [c.artist, c.date, c.mediaFormat].filter(Boolean).map(escapeHtml).join(' · ');
            const delta = c.trackCount && item.fileCount ? c.trackCount - item.fileCount : null;
            const deltaHtml = delta === null ? '' : `<span class="${Math.abs(delta) <= 1 ? 'd-ok' : 'd-bad'}">${delta >= 0 ? '+' : ''}${delta}</span>`;
            const simHtml = c.durationSimilarity == null ? '<span class="muted">—</span>'
                : `<span class="meter"><i class="${simClass(c.durationSimilarity)}" style="width:${clampPct(c.durationSimilarity)}%"></i></span>${(c.durationSimilarity * 100).toFixed(1)}%`;
            const stats = c.releaseId || !pending ? `<div class="cand-stats">
                    <div class="stat"><span class="stat-k">${escapeHtml(t('review.table.tracks'))}</span><span class="stat-v">${c.trackCount || '—'} ${deltaHtml}</span></div>
                    <div class="stat"><span class="stat-k">${escapeHtml(t('review.table.duration.similarity'))}</span><span class="stat-v">${simHtml}</span></div>
                    <div class="stat"><span class="stat-k">${escapeHtml(t('review.table.sample.support'))}</span><span class="stat-v">${c.supportCount || 0}/${c.totalSamples || 0}</span></div>
                </div>`
                : `<span class="cand-need">${escapeHtml(t('review.need.expand'))}</span>`;
            const attrs = selectable
                ? `role="radio" tabindex="0" aria-checked="${selected}" data-select="local" data-key="${escapeHtml(c.releaseId)}"`
                : '';
            return `<div class="cand ${selected ? 'selected' : ''} ${pending ? (selectable ? '' : 'disabled') : 'static'}">
                <div class="cand-row" ${attrs}>
                    <span class="radio" aria-hidden="true"></span>
                    <div class="cand-main">
                        <div class="cand-title">${escapeHtml(c.title || '')}${tags}</div>
                        <div class="cand-sub">${sub ? sub + ' · ' : ''}<span class="id">${escapeHtml(c.releaseId || c.releaseGroupId || '')}</span></div>
                    </div>
                    ${stats}
                </div>
                ${selected ? renderCompare(item, c) : ''}
            </div>`;
        }).join('');

        const expandBtn = pending && !item.candidatesExpanded
            ? `<button class="btn ghost sm" data-act="expand" ${state.busy[item.id] ? 'disabled' : ''}>${escapeHtml(t('review.expand.releases'))}</button>` : '';
        return `<section class="sec">
            <div class="sec-head"><span class="sec-title">${escapeHtml(t('review.section.mb.candidates'))}</span>
                <span class="sec-meta">${list.length}</span>${expandBtn}</div>
            <div class="cands" ${pending ? 'role="radiogroup"' : ''}>${rows}</div>
            <div class="sec-foot">${escapeHtml(t('review.candidates.hint'))}${expandBtn ? ' ' + escapeHtml(t('review.expand.retry.hint')) : ''}</div>
        </section>`;
    }

    /** 逐曲时长对照：后端早就算好了 durationDiff，以前没展示，用户只能对着一个百分比猜 */
    function renderCompare(item, c) {
        const local = item.durationSequence || [];
        const rel = c.durations || [];
        const diff = c.durationDiff || [];
        const n = Math.max(local.length, rel.length);
        if (!n || !rel.length) {
            return `<div class="cand-more"><div class="hint">${escapeHtml(t('review.compare.none'))}</div></div>`;
        }
        let rows = '';
        for (let i = 0; i < n; i++) {
            const d = diff[i] != null ? diff[i] : (local[i] != null && rel[i] != null ? local[i] - rel[i] : null);
            const cls = d == null ? 'd-bad' : (Math.abs(d) <= 2 ? 'd-ok' : (Math.abs(d) <= 7 ? 'd-warn' : 'd-bad'));
            rows += `<tr><td>${i + 1}</td>
                <td>${local[i] != null ? formatDuration(local[i]) : '—'}</td>
                <td>${rel[i] != null ? formatDuration(rel[i]) : '—'}</td>
                <td class="${cls}">${d == null ? '—' : (d > 0 ? '+' : '') + d + 's'}</td></tr>`;
        }
        return `<div class="cand-more">
            <div class="cand-more-title">${escapeHtml(t('review.compare.title'))}<span class="hint">${escapeHtml(t('review.compare.hint'))}</span></div>
            <div class="cmp-wrap"><table class="cmp">
                <thead><tr><th>#</th><th>${escapeHtml(t('review.compare.local'))}</th><th>${escapeHtml(t('review.compare.release'))}</th><th>${escapeHtml(t('review.compare.diff'))}</th></tr></thead>
                <tbody>${rows}</tbody></table></div>
        </div>`;
    }

    function renderOnline(item) {
        const list = item.onlineCandidates || [];
        const clues = item.onlineClues || [];
        if (!list.length && !clues.length) return '';
        const pending = item.status === 'PENDING_REVIEW';
        const stale = !!item.onlineEvidenceStale;
        const s = item.systemSuggestion || {};
        const sysId = s.primaryAction === 'CONFIRM_ONLINE' && s.primaryActionParams ? s.primaryActionParams.onlineCandidateId : null;
        const sel = state.selection;
        const localPaths = new Set((item.files || []).map(f => f.originalPath).filter(Boolean));
        const totalLocal = (item.files || []).length;

        const cards = list.map(c => {
            const matched = new Set((c.tracks || [])
                .filter(x => x.matchConfidence >= 0.6 && localPaths.has(x.matchedFilePath))
                .map(x => x.matchedFilePath)).size;
            const coverage = totalLocal ? matched / totalLocal : 0;
            const selectable = pending && !stale && !!c.id;
            const selected = !!(sel && sel.type === 'online' && sel.id === c.id);
            const tags = [
                c.id && c.id === sysId ? `<span class="tag sys">${escapeHtml(t('review.badge.suggested'))}</span>` : '',
                c.edition ? `<span class="tag" style="background:var(--bg-soft);color:var(--text-soft)">${escapeHtml(c.edition)}</span>` : ''
            ].join('');
            const sub = [c.albumArtist || c.artist, c.releaseDate || t('review.date.unknown')].filter(Boolean).map(escapeHtml).join(' · ');
            const covCls = coverage >= 0.85 ? 'd-ok' : (coverage >= 0.6 ? 'd-warn' : 'd-bad');
            const trackRows = (c.tracks || []).filter(x => x.matchedFilePath).map(x => `<div class="match-line"><span class="num">${x.discNo || 1}-${x.trackNo || '-'}</span>${escapeHtml(x.title || '')}
                → ${escapeHtml(baseName(x.matchedFilePath))} · ${escapeHtml(tf('review.match', percent(x.matchConfidence)))}</div>`).join('');
            const sources = (c.sources || []).map(src => `<div class="src-line"><span class="src-rel">${escapeHtml(src.reliability || '?')}</span>${linkOrText(src.url, src.title || src.domain || src.url)}${src.snippet ? ' — ' + escapeHtml(src.snippet) : ''}</div>`).join('');
            const attrs = selectable ? `role="radio" tabindex="0" aria-checked="${selected}" data-select="online" data-key="${escapeHtml(c.id)}"` : '';
            return `<div class="cand ${selected ? 'selected' : ''} ${pending ? (selectable ? '' : 'disabled') : 'static'}">
                <div class="cand-row" ${attrs}>
                    <span class="radio" aria-hidden="true"></span>
                    <div class="cand-main">
                        <div class="cand-title">${escapeHtml(c.title || '')}${tags}</div>
                        <div class="cand-sub">${sub}</div>
                        ${c.reason ? `<div class="cand-reason">${escapeHtml(c.reason)}</div>` : ''}
                    </div>
                    <div class="cand-stats">
                        <div class="stat"><span class="stat-k">${escapeHtml(t('review.stat.reliable.match'))}</span><span class="stat-v ${covCls}">${matched}/${totalLocal}</span></div>
                        <div class="stat"><span class="stat-k">${escapeHtml(t('review.stat.local.coverage'))}</span><span class="stat-v"><span class="meter"><i class="${simClass(coverage)}" style="width:${clampPct(coverage)}%"></i></span>${percent(coverage)}</span></div>
                        <div class="stat"><span class="stat-k">${escapeHtml(t('review.stat.source.self'))}</span><span class="stat-v">${percent(c.confidence)}</span></div>
                    </div>
                </div>
                ${selected || !pending ? `<div class="cand-more">
                    <div class="cand-more-title">${escapeHtml(t('review.track.match.detail'))}<span class="hint">${escapeHtml(tf('review.tracklist.summary', (c.tracks || []).length, (c.sources || []).length))}</span></div>
                    ${trackRows || `<div class="hint">—</div>`}
                    ${sources ? `<div class="cand-more-title" style="margin-top:10px">${escapeHtml(t('review.source'))}</div>${sources}` : ''}
                </div>` : ''}
            </div>`;
        }).join('');

        return `<section class="sec">
            <div class="sec-head"><span class="sec-title">${escapeHtml(t('review.section.online'))}</span>
                ${stale ? `<span class="tag stale">${escapeHtml(t('review.evidence.stale'))}</span>` : ''}
                <span class="sec-meta">${escapeHtml(tf('review.online.meta', item.onlineSearchProvider || '', item.onlineSearchModel || '', item.onlineSearchedAt ? new Date(item.onlineSearchedAt).toLocaleString() : '-'))}</span></div>
            ${stale && pending ? `<div class="banner warn" style="margin:0 0 10px">${ICON.warn}<div class="grow">${escapeHtml(t('review.online.select.stale'))}</div></div>` : ''}
            ${cards ? `<div class="cands" ${pending ? 'role="radiogroup"' : ''}>${cards}</div>` : `<div class="hint">${escapeHtml(t('review.online.none'))}</div>`}
            ${clues.length ? `<details class="plain-details" style="margin-top:10px"><summary>${escapeHtml(tf('review.clues.summary', clues.length))}</summary>
                <div class="body">${clues.map(s => `<div>${linkOrText(s.url, s.title || s.url || t('review.clue'))}</div>`).join('')}</div></details>` : ''}
        </section>`;
    }

    function renderLlm(item) {
        const llm = item.llmSuggestion;
        if (!llm) return '';
        const head = llm.choiceIndex > 0
            ? escapeHtml(t('review.llm.suggest')) + ' <strong>' + escapeHtml(llm.suggestedTitle || '') + '</strong>'
            : '<strong>' + escapeHtml(t('review.llm.none')) + '</strong>';
        return `<section class="sec">
            <div class="sec-head"><span class="sec-title">${escapeHtml(t('review.llm.section'))}</span>
                <span class="sec-meta">${escapeHtml(tf('review.llm.model', llm.model || '', llm.provider || ''))}</span></div>
            <div class="llm-box">
                <div>${head}${llm.unreleasedCompilation ? ' · <strong>' + escapeHtml(t('review.llm.unreleased')) + '</strong>' : ''}</div>
                <div class="sub">${escapeHtml(tf('review.llm.confidence', percent(llm.confidence)))} · ${escapeHtml(llm.applied ? t('review.llm.applied') : t('review.llm.suggestion.only'))}</div>
                ${llm.reason ? `<div class="sub">${escapeHtml(tf('review.llm.reason', llm.reason))}</div>` : ''}
                <div class="sub" style="margin-top:6px">${escapeHtml(t('review.llm.note'))}</div>
            </div>
        </section>`;
    }

    function renderFiles(item) {
        const files = item.files || [];
        const rows = files.map(f => `<tr>
            <td>${escapeHtml(f.fileName || '')}</td>
            <td>${escapeHtml(f.title || '')}</td>
            <td>${escapeHtml(f.artist || '')}</td>
            <td class="mono-s">${f.duration == null ? '-' : formatDuration(f.duration)}</td>
        </tr>`).join('');
        return `<section class="sec">
            <details class="plain-details" ${files.length <= 12 ? 'open' : ''}>
                <summary><span class="sec-title" style="color:var(--text)">${escapeHtml(tf('review.section.files', files.length))}</span></summary>
                <div class="table-wrap" style="margin-top:10px"><table class="table">
                    <thead><tr><th>${escapeHtml(t('review.table.filename'))}</th><th>${escapeHtml(t('review.table.track'))}</th><th>${escapeHtml(t('review.table.artist'))}</th><th>${escapeHtml(t('review.table.length'))}</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table></div>
            </details>
        </section>`;
    }

    // ==================== 决策条 ====================
    /**
     * 主按钮只有一个，而且永远说清楚它会对谁做什么：
     * 选中候选 → 确认它；没选中 → 执行系统建议的下一步；都没有 → 提示先选。
     */
    function primaryAction(item) {
        const s = item.systemSuggestion || {};
        const sel = selectedCandidate();
        if (state.selection && sel) {
            return state.selection.type === 'local'
                ? { act: 'confirm-local', label: t('review.action.confirm.selected'), cls: 'primary' }
                : { act: 'confirm-online', label: t('review.action.confirm.online.selected'), cls: 'primary' };
        }
        if (s.primaryAction === 'EXPAND' && !item.candidatesExpanded) return { act: 'expand', label: t('review.suggestion.action.expand'), cls: 'primary' };
        if (s.primaryAction === 'ONLINE_SEARCH') return { act: 'search', label: t('review.suggestion.action.search'), cls: 'primary' };
        if (s.primaryAction === 'ARCHIVE') return { act: 'archive', label: t('review.action.archive.recommended'), cls: 'primary' };
        return { act: null, label: t('review.action.select.first'), cls: 'primary' };
    }

    function renderDecision() {
        const bar = $('decision');
        const item = state.item;
        if (!item || (item.status !== 'PENDING_REVIEW' && item.status !== 'REJECTED')) {
            bar.hidden = true;
            return;
        }
        bar.hidden = false;
        const busy = state.busy[item.id];

        if (item.status === 'REJECTED') {
            bar.innerHTML = `<div class="decision-status">${busy ? busyHtml(busy) : `<span class="muted">${escapeHtml(t('review.status.rejected'))}</span>`}</div>
                <div class="decision-actions"><span class="primary-slot"><button class="btn primary" data-act="unreject" ${busy ? 'disabled' : ''}>${escapeHtml(t('review.action.unreject'))}</button></span></div>`;
            return;
        }

        const s = item.systemSuggestion || {};
        const primary = primaryAction(item);
        const sel = selectedCandidate();
        let status;
        if (busy) status = busyHtml(busy);
        else if (sel) status = `<span class="k">${escapeHtml(t('review.selected'))}</span><span class="v" title="${escapeHtml(state.selection.type === 'local' ? candidateLabel(sel) : onlineLabel(sel))}">${escapeHtml(state.selection.type === 'local' ? candidateLabel(sel) : onlineLabel(sel))}</span>`;
        else status = `<span class="muted">${escapeHtml(t('review.selected.none'))}</span>`;

        const showSearch = primary.act !== 'search';
        const menuItems = [
            item.llmJudgeEnabled ? `<button class="menu-item" data-act="llm" ${s.hasReleaseLevelCandidate ? '' : 'disabled'}>
                <span class="mi-t">${escapeHtml(t('review.action.llm.choose'))}</span><span class="mi-d">${escapeHtml(t('review.menu.llm.desc'))}</span></button>` : '',
            primary.act === 'archive' ? '' : `<button class="menu-item" data-act="archive">
                <span class="mi-t">${escapeHtml(t('review.action.archive'))}</span><span class="mi-d">${escapeHtml(stripBullet(t('review.action.hint.archive')))}</span></button>`,
            `<button class="menu-item danger" data-act="reject">
                <span class="mi-t">${escapeHtml(t('review.action.reject'))}</span><span class="mi-d">${escapeHtml(stripBullet(t('review.action.hint.reject')))}</span></button>`
        ].join('');

        bar.innerHTML = `<div class="decision-status">${status}</div>
            <div class="decision-actions">
                <div class="menu-wrap">
                    <button class="btn ghost" data-act="menu" title="${escapeHtml(t('review.action.more'))}" aria-label="${escapeHtml(t('review.action.more'))}" aria-haspopup="menu" aria-expanded="${state.menuOpen}" ${busy ? 'disabled' : ''}>${ICON.dots}<span>${escapeHtml(t('review.action.more'))}</span></button>
                    <div class="menu ${state.menuOpen && !busy ? 'show' : ''}" role="menu">${menuItems}</div>
                </div>
                ${showSearch ? `<button class="btn ghost" data-act="search" title="${escapeHtml(t('review.action.online.search'))}" aria-label="${escapeHtml(t('review.action.online.search'))}" ${busy ? 'disabled' : ''}>${ICON.search}<span>${escapeHtml(t('review.action.online.search'))}</span></button>` : ''}
                <span class="primary-slot"><button class="btn ${primary.cls}" ${primary.act ? `data-act="${primary.act}"` : 'disabled'} ${busy ? 'disabled' : ''}>
                    ${busy && busy.key === primary.act ? '<span class="spinner"></span>' : ''}${escapeHtml(primary.label)}</button></span>
            </div>`;
    }

    function busyHtml(busy) {
        const sec = Math.max(0, Math.round((Date.now() - busy.start) / 1000));
        const long = busy.key === 'search' || busy.key === 'llm' || busy.key === 'expand';
        return `<span class="spinner" aria-hidden="true"></span><span style="min-width:0">
            <span class="busy-label">${escapeHtml(busy.label)}</span> <span class="busy-sub" data-elapsed>${escapeHtml(tf('review.busy.elapsed', sec))}</span>
            ${long ? `<div class="busy-sub">${escapeHtml(t('review.busy.background'))}</div>` : ''}</span>`;
    }

    // 进行中的操作每秒刷新耗时，让用户知道没卡死
    setInterval(() => {
        const busy = state.item && state.busy[state.item.id];
        const el = document.querySelector('#decision [data-elapsed]');
        if (busy && el) el.textContent = tf('review.busy.elapsed', Math.round((Date.now() - busy.start) / 1000));
    }, 1000);

    function stripBullet(s) { return String(s || '').replace(/^\s*[·•]\s*/, ''); }

    // ==================== 操作 ====================
    const BUSY_LABEL = {
        expand: 'review.busy.expand', search: 'review.busy.search', llm: 'review.busy.llm',
        'confirm-local': 'review.busy.confirm', 'confirm-online': 'review.busy.confirm',
        archive: 'review.busy.archive', reject: 'review.busy.reject', unreject: 'review.busy.unreject'
    };

    /**
     * 统一执行入口：锁住该条目的操作、显示进度、把结果落成持续可见的反馈。
     * 成功处置（状态离开当前过滤条件）后自动跳到下一条。
     */
    async function runAction(key, path, body, { onError } = {}) {
        const id = body.id;
        const before = state.items.find(i => i.id === id) || state.item;
        const folderName = before ? before.folderName : '';
        const beforeStatus = before ? before.status : null;
        delete state.alerts[id];
        state.busy[id] = { key, label: t(BUSY_LABEL[key] || 'review.loading'), start: Date.now() };
        state.menuOpen = false;
        if (state.currentId === id) renderDetail();
        renderList();
        let data;
        try {
            data = await api(path, { method: 'POST', body: JSON.stringify(body) });
        } catch (e) {
            delete state.busy[id];
            renderList();
            if (onError && onError(e)) { if (state.currentId === id) renderDecision(); return; }
            state.alerts[id] = { tone: 'err', text: tf('review.action.failed', humanError(e.message)) };
            if (state.currentId === id) renderDetail();
            else toast(folderName + ' — ' + tf('review.action.failed', humanError(e.message)));
            return;
        }
        delete state.busy[id];
        const item = data.item;
        const filter = $('statusFilter').value;
        const resolvedOut = item && item.status !== beforeStatus && filter !== 'ALL' && item.status !== filter;

        if (item && item.status === 'PENDING_REVIEW' && key !== 'unreject') {
            // 仍在待确认：搜索/展开/LLM 正常；确认类操作说明部分失败，必须持续提示
            if (key === 'llm') {
                state.alerts[id] = { tone: 'info', text: item.llmSuggestion && !item.llmSuggestion.applied ? t('review.llm.done.suggestion') : t('review.llm.done') };
            } else if (key === 'search') {
                state.alerts[id] = { tone: 'info', text: (item.onlineCandidates || []).length ? tf('review.search.done', item.onlineCandidates.length) : t('review.online.none') };
            } else if (key === 'expand') {
                state.alerts[id] = { tone: 'info', text: t('review.expand.done') };
            } else {
                state.alerts[id] = { tone: 'warn', text: tf('review.partial.success', item.resolutionNote || '') };
            }
        }

        if (resolvedOut) {
            await advanceAfter(id, { folderName, status: item.status, note: item.resolutionNote });
            return;
        }
        if (item && item.status !== beforeStatus) {
            state.flash = { folderName, status: item.status, note: item.resolutionNote };
        }
        await loadList();
        if (state.currentId === id && item) setItem(item, { resetSelection: item.status !== beforeStatus });
        else if (state.alerts[id]) toast(folderName + ' — ' + state.alerts[id].text);
    }

    /** 处置完成后：留在原位置的下一条；队列空了就显示「已清空」 */
    async function advanceAfter(id, flash) {
        const oldIndex = state.items.findIndex(i => i.id === id);
        const wasCurrent = state.currentId === id;
        await loadList();
        if (!wasCurrent) {
            toast(tf('review.done.' + flash.status, flash.folderName || ''));
            return;
        }
        const next = state.items[Math.min(Math.max(oldIndex, 0), state.items.length - 1)];
        if (next) {
            state.flash = { ...flash, next: true };
            state.currentId = null;
            await openItem(next.id, { keepFlash: true });
        } else {
            state.flash = { ...flash, cleared: true };
            state.currentId = null;
            state.item = null;
            state.selection = null;
            renderBlank();
        }
    }

    async function doConfirmLocal() {
        const item = state.item, c = selectedCandidate();
        if (!item || !c || state.selection.type !== 'local') return;
        const ok = await ask({
            title: t('review.dialog.confirm.title'),
            facts: [[t('review.dialog.release'), candidateLabel(c)], [t('review.dialog.folder'), item.folderName], [t('review.dialog.files'), String(item.fileCount || (item.files || []).length)]],
            body: [t('review.confirm.candidate'), stripBullet(t('review.action.hint.confirm'))],
            warn: c.durationSimilarity != null && c.durationSimilarity < 0.85 ? tf('review.dialog.low.similarity', (c.durationSimilarity * 100).toFixed(1) + '%') : '',
            okText: t('review.online.submit')
        });
        if (!ok) return;
        await runAction('confirm-local', '/api/review/confirm', { id: item.id, releaseId: c.releaseId, releaseGroupId: c.releaseGroupId || '' });
    }

    async function doArchive() {
        const item = state.item;
        if (!item) return;
        const s = item.systemSuggestion || {};
        const recommended = s.primaryAction === 'ARCHIVE';
        const ok = await ask({
            title: t('review.dialog.archive.title'),
            facts: [[t('review.fact.synth.title'), item.synthesizedAlbumTitle || '-'], [t('review.fact.synth.artist'), item.synthesizedAlbumArtist || '-'], [t('review.dialog.files'), String(item.fileCount || (item.files || []).length)]],
            body: [recommended ? t('review.archive.confirm.recommended') : t('review.archive.confirm')],
            warn: s.neverSearchedOnline === true ? t('review.archive.confirm.never.searched') : '',
            okText: t('review.action.archive'),
            danger: true
        });
        if (!ok) return;
        await runAction('archive', '/api/review/archive', { id: item.id });
    }

    async function doUnreject() {
        const item = state.item;
        if (!item) return;
        const ok = await ask({
            title: t('review.action.unreject'),
            facts: [[t('review.dialog.folder'), item.folderName]],
            body: [t('review.unreject.confirm')],
            okText: t('review.action.unreject')
        });
        if (!ok) return;
        await runAction('unreject', '/api/review/unreject', { id: item.id });
    }

    function doReject() {
        if (!state.item) return;
        $('rejectNote').value = '';
        openOverlay('rejectDialog');
        setTimeout(() => $('rejectNote').focus(), 30);
    }

    async function submitReject() {
        const item = state.item;
        if (!item) return;
        const note = $('rejectNote').value;
        closeOverlay('rejectDialog');
        await runAction('reject', '/api/review/reject', { id: item.id, note });
    }

    function doSearch() {
        const item = state.item;
        if (!item || state.busy[item.id]) return;
        return runAction('search', '/api/review/online-search', { id: item.id, analyzeCover: false });
    }

    function doExpand() {
        const item = state.item;
        if (!item || state.busy[item.id]) return;
        return runAction('expand', '/api/review/expand', { id: item.id });
    }

    function doLlm() {
        const item = state.item;
        if (!item || state.busy[item.id]) return;
        return runAction('llm', '/api/review/llm', { id: item.id });
    }

    // ---------- 通用确认弹窗 ----------
    let askResolve = null;
    function ask({ title, facts = [], body = [], warn = '', okText, danger = false }) {
        $('askTitle').textContent = title;
        $('askBody').innerHTML = `
            ${facts.length ? `<dl class="ask-facts">${facts.map(([k, v]) => `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd>`).join('')}</dl>` : ''}
            <div class="ask-body">${body.filter(Boolean).map(p => `<p>${escapeHtml(p)}</p>`).join('')}</div>
            ${warn ? `<div class="ask-warn">${escapeHtml(warn)}</div>` : ''}`;
        const okBtn = $('askOk');
        okBtn.textContent = okText || t('review.confirm');
        okBtn.className = 'btn ' + (danger ? 'danger' : 'primary');
        openOverlay('askDialog');
        setTimeout(() => okBtn.focus(), 30);
        return new Promise(resolve => { askResolve = resolve; });
    }
    function settleAsk(value) {
        closeOverlay('askDialog');
        const r = askResolve;
        askResolve = null;
        if (r) r(value);
    }

    // ---------- 联网候选确认 ----------
    let pendingOnline = null; // {itemId, candidateId}
    let pendingCoverSha256 = null;

    function formatBytes(value) {
        if (value < 1024) return value + ' B';
        if (value < 1024 * 1024) return (value / 1024).toFixed(0) + ' KB';
        return (value / 1024 / 1024).toFixed(1) + ' MB';
    }

    function chooseCover(sha) {
        pendingCoverSha256 = sha || null;
        document.querySelectorAll('#coverChoices .cover-choice').forEach(el => {
            const on = !!sha && el.dataset.sha === sha;
            el.classList.toggle('selected', on);
            el.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        $('noCoverBtn').classList.toggle('soft', !sha);
    }

    async function loadCoverChoices(itemId, candidateId) {
        const box = $('coverChoices');
        box.innerHTML = `<span class="hint">${escapeHtml(t('review.online.cover.loading'))}</span>`;
        try {
            const data = await api('/api/review/cover-candidates', { method: 'POST', body: JSON.stringify({ id: itemId, candidateId }) });
            if (!pendingOnline || pendingOnline.candidateId !== candidateId) return;
            const rows = data.coverCandidates || [];
            box.innerHTML = rows.length ? rows.map(c => `<button type="button" class="cover-choice" aria-pressed="false" data-sha="${escapeHtml(c.sha256)}">
                <img loading="lazy" src="/api/cover?candidateSha256=${encodeURIComponent(c.sha256)}" alt="">
                <div class="cover-meta"><strong>${escapeHtml(t('review.online.cover.origin.' + c.origin))}</strong>${c.originLabel ? ' · ' + escapeHtml(c.originLabel) : ''}<br>${c.width}×${c.height} · ${formatBytes(c.bytes)}</div>
            </button>`).join('') : `<span class="hint">${escapeHtml(t('review.online.cover.empty'))}</span>`;
            // 不默认选中：只有人工点选的封面才会嵌入（review.online.cover.note）
        } catch (e) {
            box.innerHTML = `<span class="hint">${escapeHtml(humanError(e.message))}</span>`;
        }
    }

    function doConfirmOnline() {
        const item = state.item, c = selectedCandidate();
        if (!item || !c || state.selection.type !== 'online') return;
        pendingOnline = { itemId: item.id, candidateId: c.id };
        pendingCoverSha256 = null;
        $('ocTitle').value = c.title || '';
        $('ocArtist').value = c.albumArtist || c.artist || '';
        $('ocDate').value = c.releaseDate || '';
        $('ocEdition').value = c.edition || '';
        $('ocDir').value = '';
        $('onlineError').style.display = 'none';
        chooseCover(null);
        openOverlay('onlineDialog');
        loadCoverChoices(item.id, c.id);
    }

    function closeOnlineDialog() {
        closeOverlay('onlineDialog');
        pendingOnline = null;
        pendingCoverSha256 = null;
    }

    async function submitOnlineConfirm() {
        if (!pendingOnline) return;
        const payload = {
            id: pendingOnline.itemId,
            candidateId: pendingOnline.candidateId,
            albumTitle: $('ocTitle').value.trim(),
            albumArtist: $('ocArtist').value.trim(),
            releaseDate: $('ocDate').value.trim(),
            edition: $('ocEdition').value.trim(),
            archiveDirectoryName: $('ocDir').value.trim(),
            selectedCoverSha256: pendingCoverSha256
        };
        if (!payload.albumTitle) {
            const err = $('onlineError');
            err.textContent = t('review.album.title.required');
            err.style.display = 'block';
            $('ocTitle').focus();
            return;
        }
        closeOnlineDialog();
        await submitOnlinePayload(payload);
    }

    let pendingDuplicatePayload = null;

    async function submitOnlinePayload(payload) {
        await runAction('confirm-online', '/api/review/online-confirm', payload, {
            onError: e => {
                if (e.message !== 'online.duplicate.exists' || !e.data || !Array.isArray(e.data.duplicates)) return false;
                showDuplicateDialog(payload, e.data.duplicates);
                return true;
            }
        });
    }

    function showDuplicateDialog(payload, duplicates) {
        pendingDuplicatePayload = payload;
        $('duplicateList').innerHTML = duplicates.map(d => `
            <div>
                <div style="font-family:var(--mono);font-size:12px;overflow-wrap:anywhere"><strong>${escapeHtml(d.path)}</strong></div>
                <div class="hint">${escapeHtml(tf('review.duplicate.matched', d.matched, d.total))} ·
                    ${escapeHtml(d.replaceable ? t('review.duplicate.replaceable') : t('review.duplicate.kept'))}</div>
            </div>`).join('');
        $('duplicateReplaceBtn').disabled = !duplicates.some(d => d.replaceable);
        openOverlay('duplicateDialog');
    }

    async function resolveDuplicate(policy) {
        closeOverlay('duplicateDialog');
        const payload = pendingDuplicatePayload;
        pendingDuplicatePayload = null;
        if (!policy || !payload) return;
        await runAction('confirm-online', '/api/review/online-confirm', { ...payload, duplicatePolicy: policy });
    }

    // ---------- 弹层 ----------
    let lastFocus = null;
    function openOverlay(id) {
        lastFocus = document.activeElement;
        $(id).classList.add('show');
    }
    function closeOverlay(id) {
        $(id).classList.remove('show');
        if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
    }
    /** 各弹层统一的「取消」：保证挂起的 Promise / 暂存的 payload 都被清理 */
    function cancelOverlay(id) {
        if (id === 'askDialog') settleAsk(false);
        else if (id === 'onlineDialog') closeOnlineDialog();
        else if (id === 'duplicateDialog') resolveDuplicate(null);
        else closeOverlay(id);
    }

    // ==================== 事件 ====================
    const ACTIONS = {
        refresh: async () => {
            const btn = $('refreshBtn');
            btn.disabled = true;
            await loadList();
            if (state.currentId) await openItem(state.currentId, { keepFlash: true });
            btn.disabled = false;
        },
        back: () => { $('desk').dataset.view = 'queue'; window.scrollTo(0, 0); },
        'dismiss-flash': () => { state.flash = null; state.item ? renderDetail() : renderBlank(); },
        'dismiss-alert': () => { if (state.item) { delete state.alerts[state.item.id]; renderDetail(); } },
        menu: () => { state.menuOpen = !state.menuOpen; renderDecision(); },
        expand: doExpand,
        search: doSearch,
        llm: doLlm,
        archive: doArchive,
        reject: doReject,
        unreject: doUnreject,
        'confirm-local': doConfirmLocal,
        'confirm-online': doConfirmOnline
    };

    document.addEventListener('click', e => {
        const tab = e.target.closest('#kindTabs .kind-tab');
        if (tab) return switchKind(tab.dataset.kind);
        const open = e.target.closest('[data-open]');
        if (open) return openItem(open.dataset.open);
        const sel = e.target.closest('[data-select]');
        if (sel && !e.target.closest('a')) return select(sel.dataset.select, sel.dataset.key);
        const cover = e.target.closest('.cover-choice');
        if (cover) return chooseCover(cover.dataset.sha);
        const askBtn = e.target.closest('[data-ask]');
        if (askBtn) return settleAsk(askBtn.dataset.ask === 'ok');
        const dup = e.target.closest('[data-dup]');
        if (dup) return resolveDuplicate(dup.dataset.dup || null);
        const close = e.target.closest('[data-close]');
        if (close) return close.dataset.close === 'online' ? closeOnlineDialog() : closeOverlay('rejectDialog');
        const act = e.target.closest('[data-act]');
        if (act && !act.disabled && ACTIONS[act.dataset.act]) {
            if (act.dataset.act !== 'menu') state.menuOpen = false;
            return ACTIONS[act.dataset.act]();
        }
        if (state.menuOpen && !e.target.closest('.menu-wrap')) { state.menuOpen = false; renderDecision(); }
    });

    $('noCoverBtn').addEventListener('click', () => chooseCover(null));
    $('onlineSubmit').addEventListener('click', submitOnlineConfirm);
    $('rejectSubmit').addEventListener('click', submitReject);
    $('rejectNote').addEventListener('keydown', e => { if (e.key === 'Enter') submitReject(); });
    $('statusFilter').addEventListener('change', () => { state.flash = null; closeDetail(); loadList({ autoOpen: !isNarrow() }); });

    document.querySelectorAll('.overlay').forEach(el => {
        el.addEventListener('mousedown', e => { if (e.target === el) cancelOverlay(el.id); });
    });

    document.addEventListener('keydown', e => {
        const openOverlayEl = document.querySelector('.overlay.show');
        if (e.key === 'Escape') {
            if (openOverlayEl) return cancelOverlay(openOverlayEl.id);
            if (state.menuOpen) { state.menuOpen = false; renderDecision(); }
            return;
        }
        if (openOverlayEl || e.metaKey || e.ctrlKey || e.altKey) return;
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
        // 候选行：空格 / 回车选择
        const sel = e.target.closest && e.target.closest('[data-select]');
        if (sel && (e.key === ' ' || e.key === 'Enter')) {
            e.preventDefault();
            const key = sel.dataset.key, type = sel.dataset.select;
            select(type, key);
            const again = document.querySelector(`[data-select="${type}"][data-key="${CSS.escape(key)}"]`);
            if (again) again.focus();
            return;
        }
        if (e.key === 'j' || e.key === 'J') { e.preventDefault(); moveSelection(1); }
        else if (e.key === 'k' || e.key === 'K') { e.preventDefault(); moveSelection(-1); }
    });

    // ==================== 工具 ====================
    // 注意 Number(null) === 0：没有分数时必须显示为「无」，不能显示成 0%
    function validScore(value) {
        if (value === null || value === undefined || value === '') return false;
        const n = Number(value);
        return Number.isFinite(n) && n >= 0 && n <= 1;
    }

    function percent(value) {
        if (!validScore(value)) return '-';
        return (Number(value) * 100).toFixed(0) + '%';
    }

    function clampPct(v) { return Math.max(0, Math.min(100, Number(v) * 100)).toFixed(0); }

    function baseName(path) { return String(path || '').split(/[\\/]/).pop() || ''; }

    function formatDuration(seconds) {
        const m = Math.floor(seconds / 60);
        const s = Math.round(seconds % 60);
        return m + ':' + String(s).padStart(2, '0');
    }

    function ago(ms) {
        if (!ms) return '';
        try {
            const rtf = new Intl.RelativeTimeFormat(I18n.language === 'zh_CN' ? 'zh-CN' : 'en', { numeric: 'auto' });
            const sec = Math.round((ms - Date.now()) / 1000);
            const abs = Math.abs(sec);
            if (abs < 60) return rtf.format(sec, 'second');
            if (abs < 3600) return rtf.format(Math.round(sec / 60), 'minute');
            if (abs < 86400) return rtf.format(Math.round(sec / 3600), 'hour');
            if (abs < 86400 * 30) return rtf.format(Math.round(sec / 86400), 'day');
            return new Date(ms).toLocaleDateString();
        } catch (e) {
            return new Date(ms).toLocaleDateString();
        }
    }

    function escapeHtml(text) {
        return String(text == null ? '' : text)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // 联网候选里的 URL 可能直接来自模型输出，只放行 http/https，挡住 javascript: 等协议
    function safeUrl(url) {
        const raw = String(url == null ? '' : url).trim();
        if (!/^https?:\/\//i.test(raw)) return null;
        return escapeHtml(raw);
    }

    function linkOrText(url, label) {
        const href = safeUrl(url);
        const text = escapeHtml(label || url || t('review.source'));
        return href ? `<a href="${href}" target="_blank" rel="noopener">${text}</a>` : text;
    }

    init();
</script>
